[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phraseology"
version = "0.1.0"
description = "Practice traffic-circuit radio calls in English, out loud, with open models on your own machine."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper==1.2.1",
    "piper-tts==1.8.0",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
phraseology = "phraseology.__main__:main"

[tool.setuptools]
packages = ["phraseology"]

[tool.setuptools.package-data]
phraseology = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not audio'"
markers = ["audio: round trip through Piper and Whisper (slow, needs the models)"]
